      - generic [ref=e72]:
        - generic [ref=e74]: "02"
        - generic [ref=e75]: 搭建3D场景
        - generic [ref=e76]: 从组件库中拖拽组件搭建多层次场景，从工厂级到产线级再到设备级场景，官方提供完备的工业生产所需组件。也可自由修改官方组件和私人组
      - generic [ref=e77]:
        - generic [ref=e79]: "03"
        - generic [ref=e80]: 设计动作
        - generic [ref=e81]: 通过编辑模式，让场景中各组件的信号和接口产生连接，进行场景内部数据交互，并设计相应动作。也可通过API进行ThreeJS脚本编辑，自由设计行为动作
      - generic [ref=e82]:
        - generic [ref=e84]: "04"
        - generic [ref=e85]: 搭建2D看板
        - generic [ref=e86]: 通过看板模式给项目中每个场景设计看板，可使用收藏或上传的各类私人看板，也可使用官方提供的精美看板，自由给看板设计多种数据呈现类型
      - generic [ref=e87]:
        - generic [ref=e89]: "05"
        - generic [ref=e90]: 对接数据
        - generic [ref=e91]: 对接PLC信号数据，连接3D场景中的组件和外界信号，让场景组件和现实设备交互。对接看板数据信号，让数据可视化，宏观把控生产
